[package]
name = "coop-logs"
version = "0.4.0"
edition.workspace = true
publish = false

[dependencies]
coop-proto = { path = "../proto" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.11"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
