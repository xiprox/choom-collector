[package]
name = "coop-core"
version = "0.3.0"
edition.workspace = true
publish = false

[dependencies]
coop-proto = { path = "../proto" }
coop-logs = { path = "../logs" }
coop-mods = { path = "../mods" }
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
anyhow = "1.0.104"
serde_json = "1.0.154"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
dirs = "7.0.0"
pelite = "0.10.0"
log = "0.4.35"
velopack = "=1.2.161"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
