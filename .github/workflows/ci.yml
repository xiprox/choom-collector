name: CI

# Docs, the record, and experiments don't change what builds, so a push of only those skips CI.
on:
  push:
    paths-ignore:
      - "record/**"
      - "experiments/**"
      - ".claude/**"
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "record/**"
      - "experiments/**"
      - ".claude/**"
      - "**/*.md"
      - "LICENSE"

# A newer push to the same branch or pull request makes an unfinished run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 for its older glibc, so the Linux build also runs on older distros
        # and SteamOS.
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # gpui links fontconfig, freetype, xkbcommon, X11, and xcb on Linux
      # (record/decisions/002-gpui-through-gpui-kit.md). release.yml installs the same list.
      - name: Install gpui's Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxcb1-dev libwayland-dev
      # One build in the dev profile compiles every crate and the app, and runs every crate's
      # tests. The release profile's LTO build is release.yml's, which runs when a version ships.
      - run: cargo test --workspace --locked
