# The program's own package sits at the workspace root, so release-please, which updates the
# version of the root package, versions the program.
[package]
name = "choom-collector"
version = "0.3.0"
edition.workspace = true
description = "Test Cyberpunk 2077 mods with friends: the host's builds go out, everyone's logs come back."
license = "MIT"
repository = "https://github.com/xiprox/choom-collector"
publish = false

[[bin]]
name = "choom-collector"
path = "src/app/main.rs"

[dependencies]
coop-core = { path = "src/core" }
# Longbridge's gpui-kit bundles gpui (as the gpui-pre snapshot) and gpui-component, and both
# change between minor versions, so it's pinned (record/decisions/002-gpui-through-gpui-kit.md).
gpui-kit = "=0.9.1"
# Installs, updates (with delta packages) and uninstalls. Keep in step with VPK_VERSION in
# .github/workflows/release.yml, as the packages vpk makes are read by this crate.
velopack = "=1.2.161"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"

[workspace]
members = ["src/core", "src/logs", "src/mods", "src/proto"]
# Probes and prototypes build on their own, and never as part of the product.
exclude = ["experiments"]

[workspace.package]
edition = "2024"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
